[project]
name = "terceiro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Silvio Saczuck", email = "saczuck@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
terceiro = "terceiro:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
